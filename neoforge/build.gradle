plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
            // ./gradlew :neoforge:runClient -PwakeDemo : stage every beat in a world called "demo" and screenshot it.
            if (project.hasProperty('wakeDemo')) {
                programArguments.addAll('--quickPlaySingleplayer', 'demo', '--width', '1280', '--height', '720')
                systemProperty('thewake.demo', 'true')
            }
            // ./gradlew :neoforge:runClient -PwakeDemo2 : stage the expansion and screenshot it.
            if (project.hasProperty('wakeDemo2')) {
                programArguments.addAll('--quickPlaySingleplayer', 'demo', '--width', '1280', '--height', '720')
                systemProperty('thewake.demo2', 'true')
            }
            // ./gradlew :neoforge:runClient -PwakeDemo3 : stage the tempers as models and what they do.
            if (project.hasProperty('wakeDemo3')) {
                programArguments.addAll('--quickPlaySingleplayer', 'demo', '--width', '1280', '--height', '720')
                systemProperty('thewake.demo3', 'true')
            }
            // ./gradlew :neoforge:runClient -PwakeDemo4 : generate its places near spawn as the world does,
            // check them, and screenshot one of each (in a world called "structures").
            if (project.hasProperty('wakeDemo4')) {
                programArguments.addAll('--quickPlaySingleplayer', 'structures', '--width', '1280', '--height', '720')
                systemProperty('thewake.demo4', 'true')
            }
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
            // ./gradlew :neoforge:runServer -PwakeDemo4 : generate its places near spawn as the world does, and check them.
            if (project.hasProperty('wakeDemo4')) {
                systemProperty('thewake.demo4', 'true')
            }
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// NeoForge runs on Mojang names and needs no mixin refmap (Fabric's Loom generates one); drop the
// entry so production logs do not warn about a missing file.
processResources {
    filesMatching('thewake.mixins.json') {
        filter { String line -> line.contains('"refmap"') ? '' : line }
    }
}
